# TinyTapeout project information
project:
  title:        "Wake Controller"
  author:       "Sreemathesh K"
  discord:      ""
  description:  "Debounced 4-channel wake/event controller with selectable OR/AND wake logic, priority encoding, a saturating wake counter, and a false-wake counter, read back through a byte-wide register bus."
  language:     "Verilog"
  clock_hz:     50000000
  tiles:        "1x1"
  top_module:   "tt_um_sreemathesh_k_wake_controller"

  source_files:
    - "project.v"

pinout:
  ui[0]: "thresh_in[0]"
  ui[1]: "thresh_in[1]"
  ui[2]: "thresh_in[2]"
  ui[3]: "thresh_in[3]"
  ui[4]: "ch_en[0]"
  ui[5]: "ch_en[1]"
  ui[6]: "ch_en[2]"
  ui[7]: "ch_en[3]"

  uo[0]: "reg_sel=0: evt_flags[0] | reg1/3: data[0] | reg2/4: data[8]"
  uo[1]: "reg_sel=0: evt_flags[1] | reg1/3: data[1] | reg2/4: data[9]"
  uo[2]: "reg_sel=0: evt_flags[2] | reg1/3: data[2] | reg2/4: data[10]"
  uo[3]: "reg_sel=0: evt_flags[3] | reg1/3: data[3] | reg2/4: data[11]"
  uo[4]: "reg_sel=0: priority_ch[0] | reg1/3: data[4] | reg2/4: data[12]"
  uo[5]: "reg_sel=0: priority_ch[1] | reg1/3: data[5] | reg2/4: data[13]"
  uo[6]: "reg_sel=0: priority_ch[2] | reg1/3: data[6] | reg2/4: data[14]"
  uo[7]: "reg_sel=0: wake_out | reg1/3: data[7] | reg2/4: data[15]"

  uio[0]: "mode_and"
  uio[1]: "reg_sel[0]"
  uio[2]: "reg_sel[1]"
  uio[3]: "reg_sel[2]"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
