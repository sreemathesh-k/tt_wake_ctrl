# Tiny Tapeout project information
project:
  title:        "Multi-Channel Debounced Wake Controller"
  author:       "Sreemathesh K"
  discord:      ""
  description:  "4-channel debounced wake/event controller with priority encoding, OR/AND wake modes, runtime-configurable per-channel debounce depth and polarity, write-one-to-clear sticky status, and byte-wide register readback"
  language:     "Verilog"
  clock_hz:     10000000              # 10 MHz — matches DB=8 debounce depth well; change if you target a different clock
  # How many tiles your design occupies (1x1, 1x2, 2x2, etc). Leave 1x1 unless synthesis says you need more.
  tiles:        "1x1"
  # Top module name must start with tt_um_ and be globally unique (username baked in).
  top_module:   "tt_um_sreemathesh_k_wake_ctrl"
  # List of source files - relative to the src folder.
  source_files:
    - "project.v"

# Pinout - describe what each dedicated/bidirectional pin does.
pinout:
  ui[0]: "thresh_in[0] (normal mode) / cfg_wdata[0] (config mode) - channel 0 raw threshold input"
  ui[1]: "thresh_in[1] (normal mode) / cfg_wdata[1] (config mode) - channel 1 raw threshold input"
  ui[2]: "thresh_in[2] (normal mode) / cfg_wdata[2] (config mode) - channel 2 raw threshold input"
  ui[3]: "thresh_in[3] (normal mode) / cfg_wdata[3] (config mode) - channel 3 raw threshold input"
  ui[4]: "ch_en[0] (normal mode) / cfg_wdata[4] (config mode) - enable channel 0"
  ui[5]: "ch_en[1] (normal mode) / cfg_wdata[5] (config mode) - enable channel 1"
  ui[6]: "ch_en[2] (normal mode) / cfg_wdata[6] (config mode) - enable channel 2"
  ui[7]: "ch_en[3] (normal mode) / cfg_wdata[7] (config mode) - enable channel 3"

  uo[0]: "readback bus bit 0 (meaning depends on reg_sel, see docs/info.md)"
  uo[1]: "readback bus bit 1"
  uo[2]: "readback bus bit 2"
  uo[3]: "readback bus bit 3"
  uo[4]: "readback bus bit 4"
  uo[5]: "readback bus bit 5"
  uo[6]: "readback bus bit 6"
  uo[7]: "readback bus bit 7"

  uio[0]: "mode_and - 0: OR wake mode, 1: AND wake mode"
  uio[1]: "reg_sel[0] - register address, read (config_mode=0) or write (config_mode=1)"
  uio[2]: "reg_sel[1] - register address"
  uio[3]: "reg_sel[2] - register address"
  uio[4]: "reg_sel[3] - register address"
  uio[5]: "reg_sel[4] - register address"
  uio[6]: "cfg_we - config write strobe, edge-detected (pulse high one cycle to commit)"
  uio[7]: "cfg_mode - 0: normal sensor operation, 1: configuration write cycle"

# Do not change!
yaml_version: 6
